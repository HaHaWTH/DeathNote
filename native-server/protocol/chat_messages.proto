syntax = "proto3";
package app.chat;

message IMMsg {
  int64 MsgID = 2;
  int64 Sender = 3;
  int64 Receiver = 4;
  int32 Type = 5;
  int32 MsgType = 6;
  string Content = 7;
  int64 Time = 8;
  repeated int64 Receivers = 9;
}
message ClientSendIMMsgRequest { IMMsg Msg = 1; }
message ClientSendIMMsgResponse { int32 Ret = 1; string Content = 2; }
message ClientSyncMsgRequest {
  int32 Type = 1;
  int64 LastMsgID = 2;
  int64 Receiver = 3;
}
message ClientSyncMsgResponse { int32 Ret = 1; }
message MessageIMNoti { repeated IMMsg Msgs = 3; }
message MessageGroupMsgNoti { IMMsg Msg = 1; repeated int64 AccountIDs = 5; }
message MessageNewMsgNoti { int64 MsgID = 2; int64 Receiver = 3; }
