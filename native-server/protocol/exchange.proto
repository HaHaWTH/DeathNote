syntax = "proto3";
package app.exchange;
option csharp_namespace = "App.Protobuf.Exchange";
import "entity/player.proto";
message ExchangeRequest { int64 product_id = 1; int32 amount = 2; }
message ExchangeResponse { entity.Notification notification = 1; }
service ExchangeService {
  rpc Exchange(ExchangeRequest) returns (ExchangeResponse);
}
