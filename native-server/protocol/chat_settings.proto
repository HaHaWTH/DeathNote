syntax = "proto3";
package app.chat;
import "chat_messages.proto";

message TopicSetting { int64 topic_id = 1; bool visible = 2; }
message ChatDisplaySettings {
  bool world_channel_visible = 1;
  bool world_filter_text = 2;
  bool world_filter_stamp = 3;
  bool world_filter_entertain = 4;
  repeated TopicSetting topics = 5;
}
message ClientGetChatSettingsRequest {}
message ClientGetChatSettingsResponse {
  int32 Ret = 1;
  repeated int64 special_focus_account_ids = 2;
  int64 chat_theme_id = 3;
  int64 chat_bubble_id = 4;
  int64 chat_frame_id = 5;
  ChatDisplaySettings display_settings = 6;
}
message ClientSetChatSettingsRequest {
  repeated int64 special_focus_account_ids = 1;
  int64 chat_theme_id = 2;
  int64 chat_bubble_id = 3;
  int64 chat_frame_id = 4;
  ChatDisplaySettings display_settings = 5;
}
message ClientSetChatSettingsResponse { int32 Ret = 1; }
message GetNotificationsRequest {}
message NotificationReward { int32 resource_type = 1; int64 resource_id = 2; int32 resource_count = 3; }
message NotificationInfo {
  int64 id = 1;
  int32 notification_type = 2;
  string title = 3;
  string content = 4;
  int64 expire_at = 5;
  bool has_rewards = 6;
  bool claimed = 7;
  repeated NotificationReward rewards = 8;
  int64 created_at = 9;
}
message GetNotificationsResponse { repeated NotificationInfo notifications = 1; }
service ClientChatService {
  rpc GetChatSettings(ClientGetChatSettingsRequest) returns (ClientGetChatSettingsResponse);
  rpc SetChatSettings(ClientSetChatSettingsRequest) returns (ClientSetChatSettingsResponse);
  rpc GetNotifications(GetNotificationsRequest) returns (GetNotificationsResponse);
  rpc SyncMsg(ClientSyncMsgRequest) returns (ClientSyncMsgResponse);
  rpc SendIMMsg(ClientSendIMMsgRequest) returns (ClientSendIMMsgResponse);
}
