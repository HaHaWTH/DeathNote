syntax = "proto3";
package app.livemusic;
import "entity/player.proto";
import "social_queries/ranking_deck.proto";
import "entity/user_settings.proto";
import "google/protobuf/empty.proto";

message SaveFavoriteRequest {
  int64 live_music_master_id = 1;
  bool is_favorite_1 = 2;
  bool is_favorite_2 = 3;
  bool is_favorite_3 = 4;
}
message SaveFavoriteResponse {}
message SavePuzzleRequest { entity.MusicPuzzle puzzle = 1; }

message GetRankingRequest { int64 music_id = 1; }
message LiveRankingPlayer {
  entity.PlayerSimpleProfile player_data = 1;
  int32 score = 3;
  entity.DeckDetail high_score_deck = 4;
}
message GetRankingResponse {
  repeated LiveRankingPlayer players = 1;
  int32 my_rank = 2;
}
service LiveMusicService {
  rpc SaveFavorite(SaveFavoriteRequest) returns (SaveFavoriteResponse);
  rpc SavePuzzle(SavePuzzleRequest) returns (google.protobuf.Empty);
  rpc GetRanking(GetRankingRequest) returns (GetRankingResponse);
}
