syntax = "proto3";
package entity;
import "entity/resource.proto";
import "entity/live_finish.proto";
import "entity/carousel_help.proto";
import "entity/content_unlock.proto";
import "entity/reward_inventory.proto";
import "entity/mission.proto";
import "entity/story_episode.proto";
import "entity/gacha.proto";
import "entity/profilecard.proto";
import "entity/entitlements.proto";
import "entity/exchange.proto";
import "entity/login_bonus.proto";
import "entity/present.proto";
import "entity/stamp_favorites.proto";
import "entity/banditem.proto";
import "entity/vip_reward.proto";
import "entity/character_costume.proto";
import "entity/spot.proto";
import "entity/user_settings.proto";
import "entity/event_progress.proto";
import "entity/offline_bonus.proto";

message PlayerCredential {
  string id = 1;
  string credential = 2;
  string deviceId = 3;
  int64 profileId = 4;
}

message PlayerData {
  repeated Item items = 1;
  repeated MemberCard member_cards = 2;
  repeated SupportCard support_cards = 3;
  repeated Deck decks = 4;
  int32 main_deck = 5;
  Gem gem = 6;
  LiveBoost live_boost = 7;
  repeated BandItem band_items = 8;
  int32 player_rank_exp = 9;
  repeated LiveScore live_score = 10;
  repeated LiveMusicReward live_music_reward = 11;
  repeated CharacterRank character_rank = 12;
  repeated CharacterFriendship character_friendship = 13;
  repeated CharacterFriendshipRankReward character_friendship_rank_reward = 15;
  repeated StoryEpisode seen_story_episodes = 16;
  repeated StoryEpisode seen_story_friendship_episodes = 17;
  LiveSkip live_skip = 18;
  repeated GachaCount gacha_count = 19;
  repeated LiveMusic live_music = 20;
  repeated ExchangeCount exchange_count = 21;
  repeated GachaPoint gacha_point = 22;
  repeated LoginBonusSheet login_bonus_update = 23;
  PlayerMissionData player_mission_data = 24;
  repeated Event events = 25;
  repeated EventBoxGachaReward event_box_gacha_rewards = 26;
  repeated Stamp stamps = 27;
  LiveSetting live_setting = 28;
  repeated CarouselHelp shown_carousel_helps = 33;
  PlayerSimpleProfile my_profile = 34;
  LiveStampReward live_stamp_reward = 35;
  repeated LiveMusicComboReward live_music_combo_reward = 36;
  repeated StampFavoriteName stamp_favorite_names = 38;
  repeated ContentUnlock shown_content_unlocks = 39;
  repeated ChallengeLive challenge_live = 41;
  repeated Degree degrees = 43;
  repeated int64 chat_themes = 44;
  repeated int64 chat_bubbles = 45;
  repeated int64 chat_frames = 46;
  Vip vip = 50;
  repeated ProfileCardDetail profile_card_details = 51;
  repeated MonthlyPassState monthly_passes = 52;
  TutorialProgress tutorial_progress = 53;
  repeated int64 character_orders = 55;
  repeated int64 favorite_spot_ids = 56;
  repeated Spot spots = 57;
  bool is_night_notice_off = 58;
  repeated MusicPuzzle puzzles = 59;
  repeated CharacterCurrentCostume character_current_costumes = 61;
  repeated CharacterUnlockedCostume character_unlocked_costumes = 62;
}

message PlayerSimpleProfile {
  string id = 1;
  string name = 2;
  int32 rank_exp = 3;
  int64 last_updated_at = 4;
  DeckMemberCardDetail favorite_member_card = 5;
  int64 profile_id = 6;
  int64 favorite_member_card_master_id = 7;
  SimpleProfileCard profile_card = 8;
}

message Gem {
  int32 free = 1;
  int32 paid = 2;
  int32 platform_android = 3;
  int32 platform_ios = 4;
  int32 platform_ex = 5;
}

message LiveBoost {
  int32 amount = 1;
  int64 previous_recovery_at = 2;
  int32 daily_ad_view = 3;
  int32 daily_full_consume_count = 4;
  int64 last_daily_reset_at = 5;
  int32 campaign_daily_count = 6;
}

message LiveSkip {
  int32 count = 1;
  int64 last_skip = 2;
}

message Event {
  int64 event_id = 1;
  int32 point = 2;
  int32 medal = 3;
  int32 box_gacha_step = 4;
}

message LiveStampReward {
  int32 live_completed = 1;
  int32 reward_gained = 2;
  int64 last_live_completed_at = 3;
}

message Vip {
  int32 point = 1;
  int32 consecutive_login_count = 2;
  optional int64 last_login_count_at = 3;
  optional int64 last_daily_point_at = 4;
  int32 last_daily_reward_day_number = 5;
  optional int64 last_daily_reward_at = 6;
  int32 gained_reward_rank = 7;
}

message TutorialProgress {
  int64 finished_at = 1;
}

message Deck {
  int32 id = 1;
  string name = 2;
  repeated DeckCard cards = 3;
  int32 total_power = 4;
}

message DeckCard {
  int32 slot_index = 1;
  int32 performance_order_index = 2;
  int64 member_card_id = 3;
  int64 support_card_id = 4;
}

message MemberCard {
  int32 id = 1;
  int64 master_id = 2;
  int32 exp = 3;
  int32 awake_count = 4;
  int32 card_rank = 5;
  int32 leader_skill_level = 6;
  int32 live_skill_level = 7;
  int32 performance_skill_level = 8;
  int64 gain_at = 9;
  int32 link_skill_level = 10;
  int32 gekisou_skill_level = 11;
}

message PlayerMissionData {
  repeated MissionCounter mission_counters = 1;
  repeated MissionProgress normal_missions = 2;
  repeated MissionProgress limited_missions = 3;
  repeated CharacterMissionReceived character_missions = 4;
}

message MissionProgress {
  int64 mission_id = 1;
  int64 start_count = 2;
  bool is_completed = 3;
  bool is_received = 4;
  int64 start_at = 5;
}

message CharacterMissionReceived {
  int64 character_id = 1;
  repeated int64 mission_ids = 2;
}

enum LimitationType {
  LIMITATION_NONE = 0;
  LIMITATION_WARNING = 1;
  LIMITATION_BAN_BILLING = 2;
  LIMITATION_BAN_ACCOUNT = 3;
}

message Limitation {
  LimitationType limitation_type = 1;
  string message = 2;
  int64 limitation_id = 3;
}

message Invitation {
  repeated string new_invitation_player_ids = 1;
  bool is_invitation_code_input_already = 2;
}

message DeckMemberCardDetail {
  int64 card_id = 1;
  int32 exp = 2;
  int32 awake_count = 3;
  int32 card_rank = 4;
  int32 live_skill_level = 5;
  int32 performance_skill_level = 6;
}
message Notification {
  repeated Present posted_presents = 1;
  repeated Item item_diffs = 4;
  VipPointChange vip_point_change = 5;
  repeated OfflineBonusStartAt offline_bonus_start_ats = 8;
  repeated CharacterUnlockedCostume character_unlocked_costumes = 9;
}
message Friends {
  FriendProfiles accepted = 1;
  FriendProfiles pending_sent = 2;
  FriendProfiles receive = 3;
}
message FriendProfiles {
  reserved 1;
  int32 limit = 2;
  repeated PlayerSimpleProfile player_profiles = 3;
}
